[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toydb"
version = "0.1.0"
description = "Educational relational database server written in Python"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
toydb = "toydb.__main__:main"

[tool.setuptools.packages.find]
include = ["toydb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
